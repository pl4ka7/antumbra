name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Grant execute permission for gradlew
        working-directory: ./antumbra
        run: chmod +x gradlew
        
      - name: Build with Gradle
        working-directory: ./antumbra
        run: ./gradlew assembleDebugname: Build APK

