android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Application id is permanent once published on Google Play. Change it before the first upload.
appId=app.antumbra.browser
appVersionCode=100
appVersionName=1.0.0

# Endpoint that receives in-app reports of AI responses (Google Play AI content policy).
# Any HTTPS endpoint accepting a JSON POST works, e.g. a Formspree form or your own server.
reportEndpoint=

# Public URL of the privacy policy (required by Google Play). docs/privacy.html is ready to host.
privacyPolicyUrl=
